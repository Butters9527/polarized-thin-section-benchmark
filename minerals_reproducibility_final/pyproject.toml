[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polarized-thin-section-benchmark"
version = "1.0.0"
description = "Reproducibility code for polarized-light rock thin-section classification on the NJU dataset"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pillow>=10.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "tqdm>=4.66"
]

[tool.hatch.build.targets.wheel]
packages = ["src/mineral_id"]
