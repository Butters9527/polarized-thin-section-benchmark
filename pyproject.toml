[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polarized-thin-section-benchmark"
version = "1.0.1"
description = "Reproducibility code for polarized-light rock thin-section classification on the NJU dataset"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Runze Cui", email = "rzcui@pku.edu.cn" },
  { name = "Zhanzhan Duan", email = "duanzhan@pku.edu.cn" },
  { name = "Yongqiang Ren" },
  { name = "Xiangmei Chen" },
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pillow>=10.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "tqdm>=4.66"
]

[project.urls]
Repository = "https://github.com/Butters9527/polarized-thin-section-benchmark"

[tool.hatch.build.targets.wheel]
packages = ["src/mineral_id"]
